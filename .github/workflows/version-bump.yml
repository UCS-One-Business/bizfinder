# Copy this file to .github/workflows/version-bump.yml in a module
# repository. Every push to dev-19.0 then gets its manifest version bumped
# by CI (Z only; a push that already moved the version is left alone).
# Nothing is configured per repository: the action comes from
# ModuleDevelopment, shared with the organization, and pushes with this
# repository's GITHUB_TOKEN.
name: version-bump

on:
  push:
    branches: [dev-19.0]

permissions:
  contents: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: UCS-One-Business/ModuleDevelopment/.github/actions/addon-version-bump@dev-19.0
